name: Offline image-demo smoke tests
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke-test dependencies
        run: python -m pip install numpy pillow
      - name: Compile edited Python entry point and tests
        run: python -m py_compile scripts/colorize_image.py tests/test_colorize_image.py
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -v
